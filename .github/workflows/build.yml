name: Build

# A master so empacota: os testes ficam na CI da develop e do PR. Rodar
# `npm test` no mesmo job do build quebraria o binario, porque o `pretest`
# recompila o better-sqlite3 para o ABI do Node em vez do Electron.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: --linux
            artifact: linux
          - os: windows-latest
            arch: x64
            target: --win
            artifact: windows
          # Dois pacotes macOS: ARM nativo e Intel cross-compilado. Todos os
          # módulos e executáveis precisam respeitar a arquitetura-alvo.
          - os: macos-latest
            arch: arm64
            target: --mac --arm64
            artifact: mac-arm64
          # o runner macos-13 (Intel) fica horas na fila; o Intel sai por
          # cross-compilacao no proprio runner arm64
          - os: macos-latest
            arch: x64
            target: --mac --x64
            artifact: mac-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # ffmpeg-static baixa durante npm ci, não no electron-builder. A
          # arquitetura precisa ser a do pacote, mesmo ao cross-compilar.
          npm_config_arch: ${{ matrix.arch }}
        run: npm ci

      - name: Verify bundled ffmpeg architecture
        run: node scripts/verify-ffmpeg.mjs ${{ matrix.arch }}

      - name: Build renderer and main
        run: npm run build

      # npmRebuild: true no electron-builder.yml recompila o better-sqlite3
      # para o ABI do Electron durante o empacotamento.
      #
      # O electron-builder baixa ferramentas externas a cada execucao (binario do
      # Electron, runtime do AppImage, fpm). Um reset do CDN do GitHub derruba o
      # job inteiro sem que nada esteja errado com o codigo -- ja aconteceu. Tres
      # tentativas, com espera crescente entre elas.
      - name: Package
        shell: bash
        run: |
          for tentativa in 1 2 3; do
            if npx electron-builder ${{ matrix.target }} --publish never; then
              exit 0
            fi
            if [ "$tentativa" -lt 3 ]; then
              echo "::warning::empacotamento falhou na tentativa $tentativa; repetindo em $((tentativa * 20))s"
              sleep $((tentativa * 20))
            fi
          done
          echo "::error::empacotamento falhou nas tres tentativas"
          exit 1

      - name: Verificar ffmpeg e SQLite do pacote
        run: node scripts/verify-ffmpeg.mjs ${{ matrix.arch }} --packaged

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: livreanalise-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  rehearse:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: livreanalise-*
      - name: Validar instaladores e ensaiar a retomada da release
        run: node scripts/release.mjs rehearse

  release:
    needs: rehearse
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: livreanalise-*
      - name: Publicar instaladores verificados
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
