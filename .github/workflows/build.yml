name: Build

# A master so empacota: os testes ficam na CI da develop e do PR. Rodar
# `npm test` no mesmo job do build quebraria o binario, porque o `pretest`
# recompila o better-sqlite3 para o ABI do Node em vez do Electron.
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            artifact: linux
          - os: windows-latest
            target: --win
            artifact: windows
          # dois runners em vez de cross-compilar: cada um constroi o
          # better-sqlite3 para a sua propria arquitetura
          - os: macos-latest
            target: --mac
            artifact: mac-arm64
          - os: macos-13
            target: --mac
            artifact: mac-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main
        run: npm run build

      # npmRebuild: true no electron-builder.yml recompila o better-sqlite3
      # para o ABI do Electron durante o empacotamento.
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: livreanalise-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  # Todo push na master publica os instaladores numa release. O nome vem da
  # versao do package.json: bumpar a versao cria uma release nova, e pushes com
  # a mesma versao atualizam os arquivos da release existente.
  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar os instaladores
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # gh ja vem instalado no runner: um action de terceiro a menos na cadeia
      - name: Publicar ou atualizar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag existe: atualizando os instaladores"
            gh release upload "$tag" artifacts/* --clobber
          else
            echo "Criando a release $tag"
            gh release create "$tag" artifacts/* --generate-notes --title "$tag"
          fi
