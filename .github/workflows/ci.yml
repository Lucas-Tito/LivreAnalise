name: CI

# Testes rodam na develop e em todo PR para a master: e esse check que a
# protecao da master exige para liberar o merge.
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:node

      - name: Run tests
        run: npm test

  # A tag da release sai da versao do package.json. PR que nao incrementa faz o
  # merge sobrescrever os instaladores da release anterior em vez de publicar uma
  # nova -- foi o que aconteceu com a v0.1.0 durante meses (#43).
  versao:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir se a versao foi incrementada
        run: |
          nova=$(node -p "require('./package.json').version")
          git fetch --quiet origin master
          antiga=$(git show origin/master:package.json \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")

          if [ "$nova" = "$antiga" ]; then
            echo "::error::A versao continua $nova. Todo PR para a master precisa incrementar a versao do package.json, senao o merge sobrescreve os instaladores da release v$antiga em vez de publicar uma nova."
            exit 1
          fi

          maior=$(printf '%s\n%s\n' "$antiga" "$nova" | sort -V | tail -1)
          if [ "$maior" != "$nova" ]; then
            echo "::error::A versao regrediu: $antiga -> $nova."
            exit 1
          fi

          echo "Versao: $antiga -> $nova"
